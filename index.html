<!DOCTYPE html>
<html>
<head>
<title>GPS Backtracking - Stack</title>
</head>
<body>
  <h2>GPS Navigation - Stack Backtracking</h2>

  <div id="gps-map">
    <div class="junction" id="j1">1. Home - Cape Coast</div>
    <div class="junction" id="j2">2. Pedu Junction</div>
    <div class="junction" id="j3">3. Abura</div>
    <div class="junction" id="j4">4. Kotokoraba</div>
    <div class="junction" id="j5">5. UCC Campus - Destination</div>
  </div>

  <button id="forwardBtn">Go Forward</button>
  <button id="wrongBtn">Wrong Turn - Backtrack</button>
  <button id="backBtn">Go Back</button>

  <div id="stackDisplay">
    <p>Stack will show here</p>
  </div>

  <p id="currentLocation">You are at: Start</p>
</body>
</html>
